<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Indiana — Expedition Journal</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#16120c;color:#f3e5bd;font:16px system-ui,-apple-system,sans-serif}.wrap{max-width:1100px;margin:auto;padding:28px}.head{display:flex;justify-content:space-between;gap:20px;align-items:end;border-bottom:1px solid #6f5b32;padding-bottom:18px}.kicker{letter-spacing:.18em;color:#c7a75d;font-size:12px}.title{font:700 38px Georgia,serif;margin:4px 0}.status{font-weight:800}.green{color:#8bd17c}.amber{color:#efc56b}.red{color:#ef7777}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:20px 0}.card,.cave{background:#211a10;border:1px solid #4d4027;border-radius:12px;padding:16px}.num{font:700 28px Georgia,serif}.label{font-size:12px;color:#bba77a;text-transform:uppercase;letter-spacing:.08em}.cave h2{font:700 24px Georgia,serif;margin:0 0 8px}.row{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-top:1px solid #3a3020}.small{font-size:13px;color:#bba77a}.error{background:#381a18;border-color:#7b3732}.foot{margin-top:18px;color:#8f815f;font-size:12px}a{color:#efc56b}button{background:#3b301d;color:#f3e5bd;border:1px solid #6f5b32;border-radius:8px;padding:8px 12px;cursor:pointer}
</style></head><body><main class="wrap"><header class="head"><div><div class="kicker">SCOUT FAMILY · #1</div><h1 class="title">INDIANA</h1><div>Claim Scout Expedition Journal</div></div><div><div id="ride" class="status amber">● CHECKING...</div><div id="updated" class="small"></div></div></header><section id="stats" class="grid"></section><section class="cave"><h2>Current Cave</h2><div id="cave">Loading Indiana's field notes…</div></section><section class="cave" style="margin-top:12px"><h2>Recent Finds</h2><div id="finds"></div></section><div class="foot">Read-only field journal. This page cannot spend, claim, sign, or change Indiana's authority. <button onclick="load()">Refresh now</button></div></main><script>
const esc=s=>String(s??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[c]));
const safeUrl=u=>{try{const x=new URL(String(u));return x.protocol==='https:'?x.href:null}catch{return null}};
const money=x=>x==null?'Unknown':`$${Number(x).toLocaleString(undefined,{maximumFractionDigits:2})}`;
function stat(n,l){return `<div class="card"><div class="num">${esc(n)}</div><div class="label">${esc(l)}</div></div>`}
function findTitle(x){const u=safeUrl(x.url);return u?`<a target="_blank" rel="noopener noreferrer" href="${esc(u)}">${esc(x.title)}</a>`:`<span>${esc(x.title)}</span>`}
async function load(){try{const r=await fetch('/indiana/data',{cache:'no-store'});if(!r.ok)throw Error(`HTTP ${r.status}`);const d=await r.json();const age=d.lastPatrolAt?Date.now()-Date.parse(d.lastPatrolAt):Infinity;document.querySelector('#ride').className='status '+(age<45*60e3?'green':'amber');document.querySelector('#ride').textContent=age<45*60e3?'● RIDING':'● PATROL STALE';document.querySelector('#updated').textContent=d.lastPatrolAt?`Last patrol ${new Date(d.lastPatrolAt).toLocaleString()}`:'No patrol timestamp';document.querySelector('#stats').innerHTML=stat(d.patrols,'Patrol observations')+stat(d.uniqueFinds,'Unique finds')+stat(d.investigating,'Investigating')+stat(d.verifiedOpen,'Verified treasure')+stat(d.rejected,'Rejected / hands off')+stat(money(d.receivedUsd),'Collected');const c=d.currentCave;if(!c){document.querySelector('#cave').innerHTML='<div class="small">No unresolved cave selected.</div>'}else{const cu=safeUrl(c.url);document.querySelector('#cave').innerHTML=`<div><strong>${esc(c.title)}</strong></div><div class="row"><span>Status</span><strong>${esc(c.ownership)}</strong></div><div class="row"><span>Reward</span><strong>${c.rewardUsd!=null?money(c.rewardUsd):esc(c.rewardNativeAmount)+' '+esc(c.rewardNativeCurrency)}</strong></div><div class="row"><span>Seen</span><strong>${esc(c.seenCount)} times</strong></div><div class="row"><span>Still must prove</span><strong>${esc((c.missingChecks||[]).join(', ')||'Nothing')}</strong></div>${cu?`<div class="row"><span>Source</span><a target="_blank" rel="noopener noreferrer" href="${esc(cu)}">Open listing</a></div>`:''}`};document.querySelector('#finds').innerHTML=(d.recent||[]).map(x=>`<div class="row">${findTitle(x)}<strong>${esc(x.ownership)}</strong></div>`).join('')||'<div class="small">No finds recorded.</div>'}catch(e){document.querySelector('#ride').className='status red';document.querySelector('#ride').textContent='● JOURNAL OFFLINE';document.querySelector('#cave').innerHTML=`<div class="error card">${esc(e.message)}</div>`}}load();setInterval(load,60000);
</script></body></html>
