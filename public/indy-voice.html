<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Talk to Indy</title><style>body{font-family:system-ui,-apple-system,sans-serif;background:#0b0d10;color:#f3f4f6;margin:0;min-height:100vh;display:grid;place-items:center}.wrap{width:min(720px,92vw)}h1{font-size:2.2rem;margin-bottom:.2rem}.sub{color:#9ca3af;margin-top:0}.log{height:48vh;overflow:auto;border:1px solid #2a3038;border-radius:16px;padding:16px;background:#11151a}.m{margin:10px 0;padding:10px 12px;border-radius:12px;white-space:pre-wrap}.dad{background:#1d2939}.indy{background:#17251c}.controls{display:flex;gap:8px;margin-top:12px}input{flex:1;background:#11151a;color:white;border:1px solid #374151;border-radius:12px;padding:14px;font-size:16px}button{border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer}.mic{font-size:20px}.status{color:#9ca3af;font-size:13px;margin-top:8px}</style></head><body><main class="wrap"><h1>Indiana</h1><p class="sub">Direct line to Indy</p><section id="log" class="log"></section><div class="controls"><button id="mic" class="mic" title="Talk">🎙️</button><input id="text" autocomplete="off" placeholder="Talk to Indy…"><button id="send">Send</button></div><div id="status" class="status">Ready.</div></main><script>
const log=document.querySelector('#log'),text=document.querySelector('#text'),status=document.querySelector('#status');
function add(who,msg){const d=document.createElement('div');d.className='m '+(who==='Dad'?'dad':'indy');d.textContent=who+': '+msg;log.appendChild(d);log.scrollTop=log.scrollHeight}
function speak(msg){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(msg);u.rate=1;u.pitch=1;speechSynthesis.speak(u)}
async function send(msg){msg=String(msg||'').trim();if(!msg)return;add('Dad',msg);text.value='';status.textContent='Indy is thinking…';try{const r=await fetch('/indiana/talk',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({message:msg})});const b=await r.json();if(!r.ok)throw new Error(b.message||'Indy is unavailable');add('Indy',b.reply);speak(b.reply);status.textContent='Ready.'}catch(e){status.textContent=e.message}}
document.querySelector('#send').onclick=()=>send(text.value);text.addEventListener('keydown',e=>{if(e.key==='Enter')send(text.value)});
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;const mic=document.querySelector('#mic');if(SR){const rec=new SR();rec.lang='en-US';rec.interimResults=false;rec.onstart=()=>status.textContent='Listening…';rec.onerror=e=>status.textContent='Mic: '+e.error;rec.onresult=e=>send(e.results[0][0].transcript);mic.onclick=()=>rec.start()}else{mic.disabled=true;status.textContent='Voice recognition is not available in this browser; typing still works.'}
</script></body></html>
