name: Indiana Settlement Patrol

# Indy is parked. Keep code and reports; run only when explicitly requested.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indiana-settlement-patrol
  cancel-in-progress: false

jobs:
  patrol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Validate Indiana settlement scout
        run: node --test scouts/digital-asset.test.js

      - name: Run Indiana Settlement Scout
        run: node scouts/run-claim-scout.js

      - name: Save Indiana settlement report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: indy-settlements-${{ github.run_id }}
          path: |
            indy-settlements.json
            indy-settlements.md
          if-no-files-found: warn
          retention-days: 30
