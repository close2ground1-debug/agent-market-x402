name: Claim Scout Patrol

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/claim-scout-patrol.yml"
      - "scouts/**"

permissions:
  contents: read
  issues: write

concurrency:
  group: claim-scout-patrol
  cancel-in-progress: false

jobs:
  patrol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Validate patrol evidence and memory
        run: node --test scouts/repair.test.js scouts/digital-asset.test.js

      - name: Run Claim Scout
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLAIM_SCOUT_MEMORY_ISSUE: "1"
          CLAIM_SCOUT_AUTO_CLAIM: "disabled"
        run: node scouts/run-claim-scout.js

# Validation marker: reward normalization proof

      - name: Save digital asset findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: indy-digital-assets-${{ github.run_id }}
          path: |
            indy-digital-assets.json
            indy-digital-assets.md
          if-no-files-found: warn
          retention-days: 30
